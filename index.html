<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">

    <title>Log ind – Min vejr ven</title>
    <link rel="icon" type="image/x-icon" href="./assets/img/favicon/favicon.ico">

<body>
    <header class="top">
        <h1>Log ind</h1>
    </header>

    <main class="login">
        <p>Skriv dit brugernavn for at logge ind.</p>

        <form action="forside.html" class="boks">
            <div class="felt-raekke">
                <label for="brugernavn">Brugernavn:</label>
                <input type="text" name="brugernavn" class="felt">
            </div>
            <button type="submit" class="knap primaer">
                Log ind <i class="fa-solid fa-right-to-bracket"></i>
            </button>
        </form>

        <p class="skift-side">Har du ikke en profil? <a href="opret.html">Opret profil</a></p>
    </main>
</body>
</html>
