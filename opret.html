<html lang="da">
<head>

<body>
    <header class="top profil-top">
        <a href="index.html" class="tilbage-link">
            <i class="fa-solid fa-chevron-left"></i>
        </a>
        <h1>Opret profil</h1>

    <main class="login">
        <p>Vælg et brugernavn for at oprette en konto.</p>

        <form class="boks" onsubmit="event.preventDefault(); saveUser();">
            <div class="felt-raekke">
                <label for="nameInput">Brugernavn:</label>
                <input type="text" id="nameInput" name="brugernavn" class="felt" required minlength="3">
            </div>
            <button type="submit" class="knap primaer">
                Opret profil <i class="fa-solid fa-user-plus"></i>
            </button>
        </form>

        <p class="skift-side">Har du allerede en profil? <a href="/">Log ind</a></p>
    </main>
