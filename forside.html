<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="">
    <meta name="keywords" content="">
    <meta name="author" content="Martin Winther Clausen / Gruppe ">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min vejr ven</title>
    <link rel="icon" type="image/x-icon" href="./assets/img/favicon/">
    <link rel="stylesheet" href="./assets/css/style.css">
    <script src="./assets/js/script.js" defer></script>
    <script src="https://kit.fontawesome.com/22509d7ca3.js" crossorigin="anonymous"></script>
</head>
<body>
    <header class="top">
        <p class="hilsen">Godmorgen, Maja</p>
        <div class="top-knapper">
            <a href="index.html" class="login-link">Log ud</a>
            <a href="profile.html" class="profil-link">
                <i class="fa-solid fa-user"></i>
            </a>
        </div>
    </header>
    <main>
        <h1 class="titel">Min vejr ven</h1>
        <form class="soeg" role="search">
            <label for="soegefelt" class="soeg-label">Vejret for:</label>
            <div class="soeg-felt">
                <button type="button" class="soeg-ikon place" aria-label="Brug min position">
                    <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
                </button>
                <input type="search" id="soegefelt" name="sted" list="byer" placeholder="Vælg en by" autocomplete="off">
                <datalist id="byer">
                    <option value="København"></option>
                    <option value="Aarhus"></option>
                    <option value="Odense"></option>
                    <option value="Aalborg"></option>
                    <option value="Esbjerg"></option>
                </datalist>
                <button type="button" id="dropdownKnap" class="soeg-ikon pil" aria-label="Vis byer">
                    <i class="fa-solid fa-angle-down" aria-hidden="true"></i>
                </button>
            </div>
        </form>

        <section class="vejr-nu" aria-labelledby="temperatur">
            <img id="vejrbillede" class="vejr-billede" src="./assets/img/pictures/regn.png" alt="">
            <div class="vejr-tekst">
                <h2 id="temperatur" class="temperatur">12 grader</h2>
                <p id="vejrbeskrivelse" class="beskrivelse">Let skyet en smule regn</p>
            </div>
        </section>

        <section class="timer">
            <h2 class="timer-titel">Vejret i dag</h2>
            <p class="timer-undertitel">Temperatur (°C)</p>

            <ol class="timeliste">
                <li class="time">
                    <span class="time-tid">Nu</span>
                    <i class="fa-solid fa-cloud-sun time-ikon" aria-hidden="true"></i>
                    <span class="time-temp">17°</span>
                </li>
                <li class="time">
                    <time class="time-tid">10</time>
                    <i class="fa-solid fa-sun time-ikon" aria-hidden="true"></i>
                    <span class="time-temp">18°</span>
                </li>
                <li class="time">
                    <time class="time-tid">11</time>
                    <i class="fa-solid fa-sun time-ikon" aria-hidden="true"></i>
                    <span class="time-temp">21°</span>
                </li>
                <li class="time">
                    <time class="time-tid">12</time>
                    <i class="fa-solid fa-sun time-ikon" aria-hidden="true"></i>
                    <span class="time-temp">23°</span>
                </li>
                <li class="time">
                    <time class="time-tid">13</time>
                    <i class="fa-solid fa-sun time-ikon" aria-hidden="true"></i>
                    <span class="time-temp">24°</span>
                </li>
                <li class="time">
                    <time class="time-tid">14</time>
                    <i class="fa-solid fa-sun time-ikon" aria-hidden="true"></i>
                    <span class="time-temp">25°</span>
                </li>
            </ol>
        </section>

        <section class="toejguide" aria-labelledby="toejguide-titel">
            <h2 id="toejguide-titel" class="toejguide-titel">Tøjguide for i dag:</h2>

            <ul id="toejliste" class="toejliste">
                <li class="toej">
                    <span class="toej-cirkel">
                        <img src="./assets/img/icons/paraply.png" alt="">
                    </span>
                </li>
                <li class="toej">
                    <span class="toej-cirkel">
                        <img src="./assets/img/icons/gummistøvler.png" alt="">
                    </span>
                </li>
                <li class="toej">
                    <span class="toej-cirkel">
                        <img src="./assets/img/icons/sweater.png" alt="">
                    </span>
                </li>
                <li class="toej">
                    <span class="toej-cirkel">
                        <img src="./assets/img/icons/regnjakke.png" alt="">
                    </span>
                </li>
            </ul>
        </section>

    </main>
    <footer>

    </footer>
</body>
</html>
